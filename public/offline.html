<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline | Jayant Olhyan Portfolio OS</title>
  <meta name="theme-color" content="#0A0A0A" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="shortcut icon" href="/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0A0A0A;
      color: #E6EDF3;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow-x: hidden;
    }

    .os-window {
      width: 100%;
      max-width: 640px;
      background: #111111;
      border: 1px solid #21262D;
      border-radius: 10px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 176, 80, 0.05);
      overflow: hidden;
    }

    .os-header {
      background: #161B22;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #21262D;
    }

    .window-dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .dot-red { background: #FF5F56; }
    .dot-yellow { background: #FFBD2E; }
    .dot-green { background: #27C93F; }

    .window-title {
      font-size: 0.75rem;
      color: #8B949E;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .os-body {
      padding: 2.5rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1.5rem;
    }

    .icon-container {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(0, 176, 80, 0.1);
      border: 1px solid rgba(0, 176, 80, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #39FF14;
      box-shadow: 0 0 20px rgba(0, 176, 80, 0.2);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      border-radius: 12px;
      background: rgba(255, 189, 46, 0.1);
      border: 1px solid rgba(255, 189, 46, 0.3);
      color: #FFBD2E;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #FFBD2E;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    h1 {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: #FFFFFF;
    }

    p {
      color: #8B949E;
      font-size: 0.9rem;
      line-height: 1.6;
      max-width: 480px;
    }

    .btn-retry {
      background: #00B050;
      color: #FFFFFF;
      border: none;
      padding: 12px 28px;
      border-radius: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(0, 176, 80, 0.4);
    }

    .btn-retry:hover {
      background: #00D05E;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 176, 80, 0.6);
    }

    .btn-retry:active {
      transform: translateY(0);
    }

    .feedback-msg {
      font-size: 0.8rem;
      color: #8B949E;
      min-height: 1.2rem;
    }

    .feedback-msg.online {
      color: #39FF14;
    }

    .feedback-msg.offline {
      color: #FF5F56;
    }

    .footer-note {
      font-size: 0.75rem;
      color: #5C6A7A;
      border-top: 1px solid #21262D;
      padding-top: 1rem;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="os-window">
    <div class="os-header">
      <div class="window-dots">
        <div class="dot dot-red"></div>
        <div class="dot dot-yellow"></div>
        <div class="dot dot-green"></div>
      </div>
      <div class="window-title">jayant@os ~ /offline-status</div>
      <div style="width: 46px;"></div>
    </div>

    <div class="os-body">
      <div class="icon-container">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>

      <div class="status-badge">
        <div class="pulse-dot" id="statusDot"></div>
        <span id="statusText">NO NETWORK CONNECTION</span>
      </div>

      <h1>You're Offline</h1>

      <p>
        It looks like your device isn't connected to the internet right now.
        Some features may be temporarily unavailable, but cached pages will resume automatically once connected.
      </p>

      <button class="btn-retry" id="retryBtn" onclick="handleRetry()">
        <span>↻</span> Try Again
      </button>

      <div class="feedback-msg" id="feedbackMsg"></div>

      <div class="footer-note">
        Jayant Olhyan Portfolio OS &bull; Offline Fallback Active
      </div>
    </div>
  </div>

  <script>
    const retryBtn = document.getElementById('retryBtn');
    const feedbackMsg = document.getElementById('feedbackMsg');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');

    function checkConnection() {
      if (navigator.onLine) {
        statusText.textContent = 'ONLINE - RESTORING';
        statusDot.style.background = '#27C93F';
        feedbackMsg.className = 'feedback-msg online';
        feedbackMsg.textContent = 'Connection restored! Reloading page...';
        setTimeout(() => {
          window.location.reload();
        }, 600);
      } else {
        statusText.textContent = 'NO NETWORK CONNECTION';
        statusDot.style.background = '#FFBD2E';
      }
    }

    function handleRetry() {
      feedbackMsg.className = 'feedback-msg';
      feedbackMsg.textContent = 'Checking network connectivity...';
      
      setTimeout(() => {
        if (navigator.onLine) {
          checkConnection();
        } else {
          feedbackMsg.className = 'feedback-msg offline';
          feedbackMsg.textContent = 'Still offline. Will automatically reconnect when online.';
        }
      }, 400);
    }

    window.addEventListener('online', () => {
      checkConnection();
    });

    window.addEventListener('offline', () => {
      statusText.textContent = 'NO NETWORK CONNECTION';
      statusDot.style.background = '#FFBD2E';
      feedbackMsg.className = 'feedback-msg offline';
      feedbackMsg.textContent = 'Network disconnected.';
    });

    // Check status on initial load
    if (navigator.onLine) {
      checkConnection();
    }
  </script>
</body>
</html>
